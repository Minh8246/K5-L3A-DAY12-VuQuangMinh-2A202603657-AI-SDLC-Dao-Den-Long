<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đảo Đèn Lồng</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0820; font-family: system-ui, sans-serif; color: #ffe9c4; }
      canvas { display: block; }
      #hud { position: fixed; top: 12px; left: 12px; display: flex; gap: 10px; flex-wrap: wrap; pointer-events: none; }
      .chip { background: rgba(20, 12, 40, 0.72); border: 1px solid rgba(255, 190, 110, 0.35); border-radius: 10px; padding: 6px 12px; font-size: 15px; }
      .chip b { color: #ffc46b; }
      #hint { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); font-size: 18px; color: #ffd28a; text-shadow: 0 0 8px #000; pointer-events: none; }
      #help { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); font-size: 13px; opacity: 0.8; background: rgba(20, 12, 40, 0.6); padding: 6px 12px; border-radius: 8px; white-space: nowrap; }
      #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(10, 6, 25, 0.6); }
      #overlay .box { background: rgba(28, 18, 52, 0.95); border: 1px solid #ffb35c; border-radius: 16px; padding: 28px 40px; text-align: center; }
      #overlay h1 { margin: 0 0 8px; color: #ffc46b; }
      #overlay button { margin-top: 16px; font-size: 18px; padding: 8px 22px; border-radius: 10px; border: 0; background: #ffb35c; color: #2a1640; cursor: pointer; }
      #flash { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 160px 40px rgba(110, 40, 160, 0); transition: box-shadow 0.25s; }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="hint"></div>
    <div id="help">WASD: đi · Chuột kéo / ← →: xoay camera · Space: nhảy · E: nạp đèn · F: tỏa sáng · R: chơi lại</div>
    <div id="flash"></div>
    <div id="overlay"><div class="box"><h1 id="ov-title"></h1><div id="ov-text"></div><button id="ov-btn">Chơi lại (R)</button></div></div>
    <script type="module" src="/src/render/main.js"></script>
  </body>
</html>
